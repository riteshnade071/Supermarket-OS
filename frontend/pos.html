<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Billing — Supermarket OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #0F3B36;
    --teal-dark: #0A2823;
    --mango: #E8862E;
    --mango-dark: #C96E1E;
    --paper: #F5F3EE;
    --paper-raised: #FFFFFF;
    --ink: #16241F;
    --ink-soft: #5B6B63;
    --line: #D9D4C6;
    --danger: #B23A2E;
    --mint: #DCEDE1;
    --amber: #C97A0E;
    --amber-bg: #FBEEDA;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Work Sans', sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  header { background: var(--teal); color: #EFEDE4; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
  header .store-name { font-size: 17px; font-weight: 600; letter-spacing: 0.01em; }
  header .store-name span { display: block; font-size: 11px; font-weight: 400; color: #9FB6AE; margin-top: 1px; }
  .signal { display: flex; align-items: center; gap: 7px; font-size: 13px; color: #C9DAD3; }
  .signal .dot { width: 8px; height: 8px; border-radius: 50%; background: #5FCB8F; box-shadow: 0 0 0 3px rgba(95,203,143,0.25); }
  .signal.offline .dot { background: var(--amber); box-shadow: 0 0 0 3px rgba(201,122,14,0.25); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .offline-banner { background: var(--amber-bg); color: var(--amber); font-size: 13px; padding: 8px 20px; text-align: center; display: none; border-bottom: 1px solid #EAD3A8; }
  .offline-banner.show { display: block; }
  .layout { display: grid; grid-template-columns: 1fr 340px; max-width: 1100px; margin: 0 auto; min-height: calc(100vh - 56px); }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }
  .till { padding: 20px 20px 100px; }
  .scan-row { display: flex; gap: 10px; margin-bottom: 22px; }
  .scan-row input { flex: 1; padding: 13px 16px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--paper-raised); font-size: 15px; color: var(--ink); font-family: 'Work Sans', sans-serif; }
  .scan-row input:focus { outline: 2px solid var(--teal); outline-offset: 1px; border-color: var(--teal); }
  .scan-row button { padding: 0 20px; border-radius: 8px; border: none; background: var(--teal); color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; }
  .scan-row button:hover { background: var(--teal-dark); }
  .suggestions { position: relative; }
  .suggestions-list { position: absolute; top: 4px; left: 0; right: 0; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 20px rgba(15,59,54,0.1); z-index: 10; max-height: 240px; overflow-y: auto; display: none; }
  .suggestions-list.show { display: block; }
  .suggestion-item { padding: 11px 16px; cursor: pointer; display: flex; justify-content: space-between; font-size: 14px; border-bottom: 1px solid var(--paper); }
  .suggestion-item:last-child { border-bottom: none; }
  .suggestion-item:hover { background: var(--mint); }
  .suggestion-item .price { font-family: 'IBM Plex Mono', monospace; color: var(--ink-soft); }
  .receipt-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.04em; padding-bottom: 8px; border-bottom: 1.5px solid var(--ink); margin-bottom: 4px; }
  .line-item { display: flex; align-items: baseline; gap: 8px; padding: 13px 0; border-bottom: 1px dotted var(--line); }
  .line-item .name { font-size: 15px; font-weight: 500; }
  .line-item .leader { flex: 1; border-bottom: 1px dotted var(--line); margin-bottom: 4px; min-width: 20px; }
  .line-item .qty-controls { display: flex; align-items: center; gap: 6px; }
  .qty-btn { width: 24px; height: 24px; border-radius: 5px; border: 1px solid var(--line); background: var(--paper-raised); color: var(--ink); font-size: 15px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .qty-btn:hover { background: var(--mint); }
  .line-item .qty-num { font-size: 14px; min-width: 18px; text-align: center; }
  .line-item .line-total { font-weight: 600; font-size: 15px; min-width: 72px; text-align: right; }
  .line-item .remove { color: var(--danger); cursor: pointer; font-size: 13px; margin-left: 4px; background: none; border: none; padding: 2px 4px; }
  .empty-state { text-align: center; padding: 70px 20px; color: var(--ink-soft); }
  .empty-state .big { font-size: 16px; color: var(--ink); margin-bottom: 4px; font-weight: 500; }
  .empty-state .small { font-size: 13.5px; }
  .summary-panel { background: var(--paper-raised); border-left: 1px solid var(--line); padding: 22px 20px; position: sticky; top: 0; height: fit-content; box-shadow: -6px 0 16px rgba(15,59,54,0.04); }
  @media (max-width: 760px) { .summary-panel { position: fixed; bottom: 0; left: 0; right: 0; border-left: none; border-top: 1px solid var(--line); max-height: 60vh; overflow-y: auto; z-index: 20; } }
  .summary-row { display: flex; justify-content: space-between; font-size: 14px; color: var(--ink-soft); padding: 5px 0; }
  .summary-row .val { font-family: 'IBM Plex Mono', monospace; }
  .summary-total { display: flex; justify-content: space-between; align-items: baseline; border-top: 1.5px solid var(--ink); margin-top: 10px; padding-top: 12px; }
  .summary-total .label { font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .summary-total .val { font-family: 'IBM Plex Mono', monospace; font-size: 28px; font-weight: 600; }
  .pay-methods { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin: 18px 0 16px; }
  .pay-btn { padding: 10px 2px; border-radius: 7px; border: 1.5px solid var(--line); background: var(--paper-raised); color: var(--ink); font-size: 12.5px; font-weight: 500; cursor: pointer; }
  .pay-btn.active { background: var(--teal); border-color: var(--teal); color: #fff; }
  .checkout-btn { width: 100%; padding: 15px; border: none; border-radius: 9px; background: var(--mango); color: #2A1600; font-size: 15.5px; font-weight: 700; cursor: pointer; }
  .checkout-btn:hover { background: var(--mango-dark); }
  .checkout-btn:disabled { background: #E5E1D5; color: #A6A18F; cursor: not-allowed; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--teal); color: #fff; padding: 12px 22px; border-radius: 8px; font-size: 14px; display: none; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
  .toast.show { display: block; }
  .toast.error { background: var(--danger); }

  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .login-card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 36px 32px;
    width: 100%;
    max-width: 360px;
  }

  .login-card h1 {
    font-size: 20px;
    margin: 0 0 4px;
    color: var(--teal);
  }

  .login-card .sub {
    font-size: 13.5px;
    color: var(--ink-soft);
    margin-bottom: 24px;
  }

  .field { margin-bottom: 14px; }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 6px;
    color: var(--ink);
  }

  .field input {
    width: 100%;
    padding: 11px 13px;
    border-radius: 7px;
    border: 1.5px solid var(--line);
    font-size: 14.5px;
    font-family: 'Work Sans', sans-serif;
  }

  .field input:focus {
    outline: 2px solid var(--teal);
    outline-offset: 1px;
    border-color: var(--teal);
  }

  .login-btn {
    width: 100%;
    padding: 13px;
    margin-top: 6px;
    border: none;
    border-radius: 8px;
    background: var(--mango);
    color: #2A1600;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  .login-btn:hover { background: var(--mango-dark); }

  .login-error {
    background: #F7E6E3;
    color: var(--danger);
    font-size: 13px;
    padding: 9px 12px;
    border-radius: 7px;
    margin-bottom: 14px;
    display: none;
  }

  .login-error.show { display: block; }

  .logout-btn {
    background: none;
    border: none;
    color: #C9DAD3;
    font-size: 12.5px;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
  }
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <h1>Billing counter</h1>
    <div class="sub">Log in with your store phone number and password</div>
    <div class="login-error" id="loginError"></div>
    <div class="field">
      <label>Phone number</label>
      <input id="loginPhone" type="tel" placeholder="9876543210" autocomplete="username" />
    </div>
    <div class="field">
      <label>Password</label>
      <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button class="login-btn" onclick="handleLogin()">Log in</button>
  </div>
</div>

<div id="mainApp" style="display:none;">
<header>
  <div class="store-name">
    Billing counter
    <span id="storeLabel">—</span>
  </div>
  <div style="display:flex; align-items:center; gap:16px;">
    <div class="signal" id="signal">
      <span class="dot"></span>
      <span id="signalText">Connected</span>
    </div>
    <button class="logout-btn" onclick="handleLogout()">Log out</button>
  </div>
</header>

<div class="offline-banner" id="offlineBanner">
  No connection right now — bills are being saved and will send once you're back online.
</div>

<div class="layout">
  <div class="till">
    <div class="scan-row suggestions">
      <input id="scanInput" placeholder="Scan a barcode or type a product name" autocomplete="off" autofocus />
      <button onclick="handleScanEnter()">Add</button>
      <div class="suggestions-list" id="suggestionsList"></div>
    </div>

    <div id="receiptArea">
      <div class="empty-state">
        <div class="big">No items yet</div>
        <div class="small">Scan a barcode or search a product name to start the bill</div>
      </div>
    </div>
  </div>

  <div class="summary-panel">
    <div class="summary-row"><span>Subtotal</span><span class="val" id="subtotalVal">₹0</span></div>
    <div class="summary-row"><span>Tax</span><span class="val" id="taxVal">₹0</span></div>
    <div class="summary-total">
      <span class="label">Total</span>
      <span class="val" id="totalVal">₹0</span>
    </div>

    <div class="pay-methods">
      <button class="pay-btn active" data-method="cash">Cash</button>
      <button class="pay-btn" data-method="upi">UPI</button>
      <button class="pay-btn" data-method="card">Card</button>
      <button class="pay-btn" data-method="credit">Credit</button>
    </div>

    <button class="checkout-btn" id="checkoutBtn" disabled onclick="checkout()">Complete sale</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ====== CONFIG — only this one line needs editing per deployment ======
const API_BASE = "https://supermarket-os-1.onrender.com";
// ========================================================================

let cart = [];
let paymentMethod = "cash";
let allProducts = [];
let isOnline = navigator.onLine;

// ---------- session (token + store context from login) ----------
let session = JSON.parse(localStorage.getItem("session") || "null");

function authHeaders() {
  return session ? { "Authorization": `Bearer ${session.access_token}` } : {};
}

function saveSession(data) {
  session = data;
  localStorage.setItem("session", JSON.stringify(data));
}

function clearSession() {
  session = null;
  localStorage.removeItem("session");
}

async function handleLogin() {
  const phone = document.getElementById("loginPhone").value.trim();
  const password = document.getElementById("loginPassword").value;
  const errorBox = document.getElementById("loginError");
  errorBox.classList.remove("show");

  if (!phone || !password) {
    errorBox.textContent = "Enter both phone number and password.";
    errorBox.classList.add("show");
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone, password }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      errorBox.textContent = err.detail || "Login failed. Check your phone number and password.";
      errorBox.classList.add("show");
      return;
    }
    const data = await res.json();
    saveSession(data);
    enterApp();
  } catch (e) {
    errorBox.textContent = "Couldn't reach the server. Check your connection and try again.";
    errorBox.classList.add("show");
  }
}

function handleLogout() {
  clearSession();
  document.getElementById("mainApp").style.display = "none";
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("loginPhone").value = "";
  document.getElementById("loginPassword").value = "";
}

function enterApp() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("mainApp").style.display = "block";
  document.getElementById("storeLabel").textContent = session.name + " · " + session.role;
  loadCatalog();
  if (isOnline) syncOfflineQueue();
}

document.getElementById("loginPassword").addEventListener("keypress", (e) => {
  if (e.key === "Enter") handleLogin();
});

function formatMoney(n) {
  return "₹" + Math.round(n).toLocaleString("en-IN");
}

async function loadCatalog() {
  try {
    const res = await fetch(`${API_BASE}/inventory/products`, { headers: authHeaders() });
    if (res.ok) allProducts = await res.json();
  } catch { }
}

async function lookupByBarcode(code) {
  try {
    const res = await fetch(`${API_BASE}/inventory/products/barcode/${encodeURIComponent(code)}`, { headers: authHeaders() });
    if (!res.ok) return null;
    return await res.json();
  } catch { return null; }
}

const input = document.getElementById("scanInput");
const suggestionsList = document.getElementById("suggestionsList");

input.addEventListener("input", () => {
  const q = input.value.trim().toLowerCase();
  if (!q) { suggestionsList.classList.remove("show"); return; }
  const matches = allProducts.filter(p => p.name.toLowerCase().includes(q)).slice(0, 6);
  if (matches.length === 0) { suggestionsList.classList.remove("show"); return; }
  suggestionsList.innerHTML = matches.map(p => `
    <div class="suggestion-item" data-id="${p.id}">
      <span>${p.name}</span>
      <span class="price mono">₹${p.selling_price}</span>
    </div>
  `).join("");
  suggestionsList.classList.add("show");
});

suggestionsList.addEventListener("click", (e) => {
  const item = e.target.closest(".suggestion-item");
  if (!item) return;
  const product = allProducts.find(p => p.id === item.dataset.id);
  if (product) addToCart(product);
  input.value = "";
  suggestionsList.classList.remove("show");
  input.focus();
});

document.addEventListener("click", (e) => {
  if (!e.target.closest(".suggestions")) suggestionsList.classList.remove("show");
});

async function handleScanEnter() {
  const code = input.value.trim();
  if (!code) return;
  const exact = allProducts.find(p => p.barcode === code);
  if (exact) {
    addToCart(exact);
    input.value = "";
    suggestionsList.classList.remove("show");
    return;
  }
  const product = await lookupByBarcode(code);
  if (product) {
    addToCart(product);
    input.value = "";
    suggestionsList.classList.remove("show");
  } else {
    showToast("No product found for that code", true);
  }
}

input.addEventListener("keypress", (e) => {
  if (e.key === "Enter") handleScanEnter();
});

function addToCart(product) {
  const existing = cart.find(i => i.product_id === product.id);
  if (existing) {
    existing.quantity += 1;
  } else {
    cart.push({
      product_id: product.id,
      name: product.name,
      quantity: 1,
      unit_price: product.selling_price,
      gst_rate: product.gst_rate || 0,
    });
  }
  renderCart();
}

function changeQty(productId, delta) {
  const item = cart.find(i => i.product_id === productId);
  if (!item) return;
  item.quantity += delta;
  if (item.quantity <= 0) cart = cart.filter(i => i.product_id !== productId);
  renderCart();
}

function removeItem(productId) {
  cart = cart.filter(i => i.product_id !== productId);
  renderCart();
}

function renderCart() {
  const area = document.getElementById("receiptArea");
  if (cart.length === 0) {
    area.innerHTML = `
      <div class="empty-state">
        <div class="big">No items yet</div>
        <div class="small">Scan a barcode or search a product name to start the bill</div>
      </div>`;
  } else {
    const rows = cart.map(item => `
      <div class="line-item">
        <span class="name">${item.name}</span>
        <span class="leader"></span>
        <span class="qty-controls">
          <button class="qty-btn" onclick="changeQty('${item.product_id}', -1)">−</button>
          <span class="qty-num mono">${item.quantity}</span>
          <button class="qty-btn" onclick="changeQty('${item.product_id}', 1)">+</button>
        </span>
        <span class="line-total mono">${formatMoney(item.quantity * item.unit_price)}</span>
        <button class="remove" onclick="removeItem('${item.product_id}')">Remove</button>
      </div>
    `).join("");
    area.innerHTML = `<div class="receipt-head"><span>Item</span><span>Amount</span></div>${rows}`;
  }

  const subtotal = cart.reduce((s, i) => s + i.quantity * i.unit_price, 0);
  const tax = cart.reduce((s, i) => s + (i.quantity * i.unit_price * i.gst_rate / 100), 0);
  document.getElementById("subtotalVal").textContent = formatMoney(subtotal);
  document.getElementById("taxVal").textContent = formatMoney(tax);
  document.getElementById("totalVal").textContent = formatMoney(subtotal + tax);
  document.getElementById("checkoutBtn").disabled = cart.length === 0;
}

document.querySelectorAll(".pay-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".pay-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    paymentMethod = btn.dataset.method;
  });
});

function queueOfflineSale(saleData) {
  const queue = JSON.parse(localStorage.getItem("offline_sale_queue") || "[]");
  queue.push({ ...saleData, queued_at: new Date().toISOString() });
  localStorage.setItem("offline_sale_queue", JSON.stringify(queue));
}

async function syncOfflineQueue() {
  const queue = JSON.parse(localStorage.getItem("offline_sale_queue") || "[]");
  if (!queue.length || !session) return;
  const remaining = [];
  for (const sale of queue) {
    try {
      const res = await fetch(`${API_BASE}/pos/sales`, {
        method: "POST", headers: { "Content-Type": "application/json", ...authHeaders() },
        body: JSON.stringify(sale),
      });
      if (!res.ok) remaining.push(sale);
    } catch { remaining.push(sale); }
  }
  localStorage.setItem("offline_sale_queue", JSON.stringify(remaining));
  if (remaining.length === 0 && queue.length > 0) {
    showToast(`${queue.length} saved bill${queue.length > 1 ? "s" : ""} sent`);
  }
}

function updateSignal() {
  const signal = document.getElementById("signal");
  const text = document.getElementById("signalText");
  const banner = document.getElementById("offlineBanner");
  if (isOnline) {
    signal.classList.remove("offline");
    text.textContent = "Connected";
    banner.classList.remove("show");
  } else {
    signal.classList.add("offline");
    text.textContent = "No connection";
    banner.classList.add("show");
  }
}

window.addEventListener("online", () => { isOnline = true; updateSignal(); syncOfflineQueue(); loadCatalog(); });
window.addEventListener("offline", () => { isOnline = false; updateSignal(); });

async function checkout() {
  if (cart.length === 0) return;
  const saleData = {
    store_id: session.store_id,
    items: cart.map(i => ({
      product_id: i.product_id, quantity: i.quantity,
      unit_price: i.unit_price, gst_rate: i.gst_rate,
    })),
    discount: 0,
    payment_method: paymentMethod,
  };

  const btn = document.getElementById("checkoutBtn");
  btn.disabled = true;
  btn.textContent = "Processing…";

  try {
    const res = await fetch(`${API_BASE}/pos/sales`, {
      method: "POST", headers: { "Content-Type": "application/json", ...authHeaders() },
      body: JSON.stringify(saleData),
    });
    if (!res.ok) throw new Error("Server rejected sale");
    const sale = await res.json();
    showToast(`Bill ${sale.bill_number} complete — ${formatMoney(sale.total)}`);
  } catch (e) {
    queueOfflineSale(saleData);
    showToast("No connection — bill saved, will send automatically", true);
  }

  cart = [];
  renderCart();
  btn.textContent = "Complete sale";
  input.focus();
}

function showToast(msg, isError) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (isError ? " error" : "");
  setTimeout(() => { t.className = "toast"; }, 3200);
}

updateSignal();
if (session) {
  enterApp();
} else {
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("mainApp").style.display = "none";
}
</script>
</body>
</html>
