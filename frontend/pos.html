<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supermarket OS — Billing</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b;
    --accent: #22c55e; --accent-dim: #16311f; --danger: #ef4444;
    --text: #e8eaed; --muted: #8a8f98; --border: #2a2f3a;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; display:flex; flex-direction:column; }
  header { padding:16px; background: var(--panel); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:16px; margin:0; }
  .status { font-size:11px; padding:3px 8px; border-radius:20px; }
  .status.online { background: var(--accent-dim); color: var(--accent); }
  .status.offline { background:#3a1d1d; color: var(--danger); }
  .search-bar { padding:12px 16px; display:flex; gap:8px; }
  .search-bar input { flex:1; padding:12px; border-radius:8px; border:1px solid var(--border); background: var(--panel2); color:var(--text); font-size:15px; }
  .search-bar button { padding:12px 16px; border-radius:8px; border:none; background:var(--accent); color:#04180c; font-weight:600; }
  .cart { flex:1; overflow-y:auto; padding: 0 16px; }
  .cart-item { display:flex; justify-content:space-between; align-items:center; padding:12px; background:var(--panel2); border-radius:10px; margin-bottom:8px; }
  .cart-item .name { font-size:14px; }
  .cart-item .qty-price { color:var(--muted); font-size:12px; }
  .cart-item .line-total { font-weight:600; }
  .empty { text-align:center; color:var(--muted); padding:40px 0; font-size:14px; }
  .summary { padding:16px; background:var(--panel); border-top:1px solid var(--border); }
  .row { display:flex; justify-content:space-between; padding:4px 0; font-size:14px; color:var(--muted); }
  .row.total { font-size:20px; font-weight:700; color:var(--text); border-top:1px solid var(--border); margin-top:8px; padding-top:10px; }
  .pay-methods { display:grid; grid-template-columns: repeat(4,1fr); gap:8px; margin:12px 0; }
  .pay-methods button { padding:10px 4px; border-radius:8px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font-size:12px; cursor:pointer; }
  .pay-methods button.active { background:var(--accent); color:#04180c; border-color:var(--accent); font-weight:600; }
  .checkout-btn { width:100%; padding:16px; border:none; border-radius:10px; background:var(--accent); color:#04180c; font-size:16px; font-weight:700; cursor:pointer; }
  .checkout-btn:disabled { background:#334; color:#889; cursor:not-allowed; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--accent); color:var(--text); padding:12px 20px; border-radius:8px; font-size:14px; display:none; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🧾 Billing</h1>
    <span id="netStatus" class="status online">● Online</span>
  </header>

  <div class="search-bar">
    <input id="searchInput" placeholder="🔎 Search / Scan Barcode" autofocus />
    <button onclick="addByBarcode()">Add</button>
  </div>

  <div class="cart" id="cart">
    <div class="empty">Cart is empty — scan a product to start billing</div>
  </div>

  <div class="summary">
    <div class="row"><span>Subtotal</span><span id="subtotal">₹0</span></div>
    <div class="row"><span>Tax</span><span id="taxAmt">₹0</span></div>
    <div class="row total"><span>TOTAL</span><span id="total">₹0</span></div>

    <div class="pay-methods">
      <button class="pay-btn active" data-method="cash">CASH</button>
      <button class="pay-btn" data-method="upi">UPI</button>
      <button class="pay-btn" data-method="card">CARD</button>
      <button class="pay-btn" data-method="credit">CREDIT</button>
    </div>

    <button class="checkout-btn" id="checkoutBtn" onclick="checkout()">Complete Sale</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ====== CONFIG ======
const API_BASE = "http://localhost:8000"; // change to your Render URL after deploy
const TENANT_ID = "REPLACE_WITH_TENANT_ID";
const STORE_ID = "REPLACE_WITH_STORE_ID";

let cart = []; // {product_id, name, quantity, unit_price, gst_rate}
let paymentMethod = "cash";
let isOnline = navigator.onLine;

// ====== OFFLINE QUEUE (critical - billing must never stop) ======
function queueOfflineSale(saleData) {
  const queue = JSON.parse(localStorage.getItem("offline_sale_queue") || "[]");
  queue.push({ ...saleData, queued_at: new Date().toISOString() });
  localStorage.setItem("offline_sale_queue", JSON.stringify(queue));
}

async function syncOfflineQueue() {
  const queue = JSON.parse(localStorage.getItem("offline_sale_queue") || "[]");
  if (!queue.length) return;
  const remaining = [];
  for (const sale of queue) {
    try {
      const res = await fetch(`${API_BASE}/pos/sales?tenant_id=${TENANT_ID}`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(sale),
      });
      if (!res.ok) remaining.push(sale);
    } catch { remaining.push(sale); }
  }
  localStorage.setItem("offline_sale_queue", JSON.stringify(remaining));
  if (remaining.length === 0) showToast(`✅ ${queue.length} offline bills synced`);
}

window.addEventListener("online", () => { isOnline = true; updateNetStatus(); syncOfflineQueue(); });
window.addEventListener("offline", () => { isOnline = false; updateNetStatus(); });

function updateNetStatus() {
  const el = document.getElementById("netStatus");
  el.textContent = isOnline ? "● Online" : "● Offline (billing continues)";
  el.className = "status " + (isOnline ? "online" : "offline");
}

// ====== PRODUCT LOOKUP ======
async function lookupProduct(barcode) {
  try {
    const res = await fetch(`${API_BASE}/inventory/products/barcode/${barcode}?tenant_id=${TENANT_ID}`);
    if (!res.ok) return null;
    return await res.json();
  } catch {
    return null; // offline - can't look up new products, but existing cart items still work
  }
}

async function addByBarcode() {
  const input = document.getElementById("searchInput");
  const code = input.value.trim();
  if (!code) return;

  const product = await lookupProduct(code);
  if (!product) {
    showToast("⚠️ Product not found (or offline)");
    return;
  }

  const existing = cart.find(i => i.product_id === product.id);
  if (existing) {
    existing.quantity += 1;
  } else {
    cart.push({
      product_id: product.id,
      name: product.name,
      quantity: 1,
      unit_price: product.selling_price,
      gst_rate: product.gst_rate || 0,
    });
  }
  input.value = "";
  renderCart();
}

document.getElementById("searchInput").addEventListener("keypress", (e) => {
  if (e.key === "Enter") addByBarcode();
});

document.querySelectorAll(".pay-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".pay-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    paymentMethod = btn.dataset.method;
  });
});

function renderCart() {
  const cartEl = document.getElementById("cart");
  if (cart.length === 0) {
    cartEl.innerHTML = '<div class="empty">Cart is empty — scan a product to start billing</div>';
  } else {
    cartEl.innerHTML = cart.map((item, idx) => `
      <div class="cart-item">
        <div>
          <div class="name">${item.name}</div>
          <div class="qty-price">${item.quantity} × ₹${item.unit_price}</div>
        </div>
        <div class="line-total">₹${(item.quantity * item.unit_price).toFixed(0)}</div>
      </div>
    `).join("");
  }

  const subtotal = cart.reduce((s, i) => s + i.quantity * i.unit_price, 0);
  const tax = cart.reduce((s, i) => s + (i.quantity * i.unit_price * i.gst_rate / 100), 0);
  document.getElementById("subtotal").textContent = `₹${subtotal.toFixed(0)}`;
  document.getElementById("taxAmt").textContent = `₹${tax.toFixed(0)}`;
  document.getElementById("total").textContent = `₹${(subtotal + tax).toFixed(0)}`;
  document.getElementById("checkoutBtn").disabled = cart.length === 0;
}

async function checkout() {
  if (cart.length === 0) return;

  const saleData = {
    store_id: STORE_ID,
    items: cart.map(i => ({
      product_id: i.product_id, quantity: i.quantity,
      unit_price: i.unit_price, gst_rate: i.gst_rate,
    })),
    discount: 0,
    payment_method: paymentMethod,
  };

  try {
    const res = await fetch(`${API_BASE}/pos/sales?tenant_id=${TENANT_ID}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(saleData),
    });
    if (!res.ok) throw new Error("Server rejected sale");
    const sale = await res.json();
    showToast(`✅ Bill ${sale.bill_number} — ₹${sale.total}`);
  } catch (e) {
    // OFFLINE-FIRST: never block the cashier. Queue and move on.
    queueOfflineSale(saleData);
    showToast("📴 Saved offline — will sync when online");
  }

  cart = [];
  renderCart();
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(() => { t.style.display = "none"; }, 3000);
}

updateNetStatus();
if (isOnline) syncOfflineQueue();
</script>
</body>
</html>
