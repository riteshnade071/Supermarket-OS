services:
  - type: web
    name: supermarket-os-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: supermarket-os-db
          property: connectionString

databases:
  - name: supermarket-os-db
    plan: free
